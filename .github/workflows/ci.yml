name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Two separate TS projects, each with its own node_modules — install both.
      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      # Root script runs `tsc --noEmit` on both sides.
      - name: Typecheck
        run: npm run typecheck

      # Server unit + route tests (Vitest + supertest). Services are mocked —
      # no live APIs, no secrets needed.
      - name: Test server
        working-directory: server
        run: npm test

      # Mirrors what Vercel runs on deploy — catches bundling breakage typecheck misses.
      - name: Build client
        working-directory: client
        run: npm run build
